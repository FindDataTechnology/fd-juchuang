# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# fd-juchuang 单仓双镜像：web / api。Standard channel（scs001 公开快照线）。
name: image

# 2026-11-09 按 image-quota-allocation R2 停用私有仓自动出片：出片由公开镜像仓
# scs001/fd-juchuang-images 承担（免费；已用 git tree 逐 blob 核对与本源仓 0 差异）。
# 本仓 CI 因组织私有额度耗尽而全部瞬时失败，无产出。保留手动入口以便回滚。
on:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip

          pip install -e ".[dev]"

      - name: Test suite
        working-directory: server
        run: python -m pytest tests/ -q

  fd-juchuang-web:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-juchuang-web
      namespace: finddata-business
      # 本仓两个 Dockerfile 各在自己的子目录；不传会默认找根 Dockerfile 而失败
      # （2026-11-22 实测：`open Dockerfile: no such file or directory`）。
      dockerfile: web/Dockerfile
      context: web

  fd-juchuang-api:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-juchuang-api
      namespace: finddata-business
      dockerfile: server/Dockerfile
      context: server
