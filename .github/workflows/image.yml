# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# fd-juchuang 单仓双镜像：web / api。Standard channel（scs001 公开快照线）。
name: image

# 2026-11-22 恢复 push 自动出片：本仓已公开（公开仓 Actions 免费无限），
# 而 2026-11-09 指定的替代出片仓 scs001/fd-juchuang-images 已退役/归档 —— 那条
# 自动路径早已不存在，只剩手动 dispatch，于是 push 之后一直没有新镜像。
# 下面的 api-test 是 build 的前置（needs: api-test），所以测试也随 push 自动跑。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip

          pip install -e ".[dev]"

      - name: Test suite
        working-directory: server
        run: python -m pytest tests/ -q

  fd-juchuang-web:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-juchuang-web
      namespace: finddata-business
      # 本仓两个 Dockerfile 各在自己的子目录；不传会默认找根 Dockerfile 而失败
      # （2026-11-22 实测：`open Dockerfile: no such file or directory`）。
      dockerfile: web/Dockerfile
      context: web

  fd-juchuang-api:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-juchuang-api
      namespace: finddata-business
      dockerfile: server/Dockerfile
      context: server
