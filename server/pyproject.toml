[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-juchuang-api"
version = "0.1.0"
description = "剧创（Juchuang）产品门面服务端：剧本结构化项目/角色/场次/台词、底料管线与个人层自有存储。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
